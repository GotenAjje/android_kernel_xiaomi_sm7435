name: Debug - Cek Defconfig

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          ref: lineage-23.0
          submodules: recursive
          fetch-depth: 1

      - name: Cek Isi Directory Configs
        run: |
          echo "=================================================="
          echo "🔍 Melihat isi dari arch/arm64/configs/"
          echo "=================================================="
          ls -la arch/arm64/configs/
          echo ""
          echo "=================================================="
          echo "🔍 Mencari file yang mengandung kata 'garnet':"
          echo "=================================================="
          find arch/arm64/configs/ -name "*garnet*"
          echo ""
          echo "=================================================="
          echo "🔍 Mencari file yang mengandung kata 'sm7435':"
          echo "=================================================="
          find arch/arm64/configs/ -name "*sm7435*"
          echo ""
          echo "=================================================="
          echo "🔍 Mencari file yang mengandung kata 'vendor':"
          echo "=================================================="
          find arch/arm64/configs/ -name "*vendor*"
