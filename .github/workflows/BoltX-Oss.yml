name: Build BoltX-Oss Kernel 5.10 (SM7435)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      # Branding kernel
      KERNEL_NAME: "BoltX-Oss"
      
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          # Menggunakan branch lineage-23.0 untuk Android 15
          ref: lineage-23.0
          submodules: recursive
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          echo "Installing build dependencies..."
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev git curl \
          python3 python3-pip lld zip unzip libncurses5-dev \
          libelf-dev zlib1g-dev dwarves

      - name: Setup Toolchain (Clang 19)
        run: |
          mkdir -p toolchain/clang
          # Menggunakan Clang 19 sesuai instruksi awal
          CLANG_URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main-kernel-2025/clang-r536225.tar.gz"
          
          echo "Downloading Clang 19..."
          curl -L "${CLANG_URL}" | tar -xz -C toolchain/clang
          
      - name: Prepare & Configure Kernel
        run: |
          # Set Path dan Environment
          export PATH="$(pwd)/toolchain/clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export LLVM=1
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          
          echo "🔧 [1/3] Menggunakan defconfig dari repository"
          # Menggunakan defconfig default dari repository
          make O=out ARCH=arm64 LLVM=1 defconfig
          
          # --- Custom Configs ---
          
          # 1. Set Kernel Name (Branding)
          echo "🔧 [2/3] Menerapkan branding kernel..."
          scripts/config --file out/.config --set-str LOCALVERSION "-${KERNEL_NAME}"
          
          # 2. Disable Certificate Signing (Mencegah error keys)
          echo "🔧 [3/3] Menonaktifkan System Trusted Keys..."
          scripts/config --file out/.config -d SYSTEM_TRUSTED_KEYS
          scripts/config --file out/.config -d SYSTEM_REVOCATION_KEYS
          
          echo "✅ Konfigurasi kernel selesai."

      - name: Build Kernel Image & DTB
        run: |
          # Set Path dan Environment
          export PATH="$(pwd)/toolchain/clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export LLVM=1
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          
          echo "🚀 [1/2] Memulai build kernel Image..."
          make -j"$(nproc --all)" O=out LLVM=1 CLANG_TRIPLE=$CLANG_TRIPLE CROSS_COMPILE=$CROSS_COMPILE Image
          
          echo "🚀 [2/2] Memulai build DTB..."
          make -j"$(nproc --all)" O=out LLVM=1 CLANG_TRIPLE=$CLANG_TRIPLE CROSS_COMPILE=$CROSS_COMPILE dtbs
          
      - name: Check Kernel Version Name
        run: |
          echo "ℹ️ Kernel version info:"
          strings out/arch/arm64/boot/Image | grep "Linux version" | head -n 1

      - name: Upload Kernel Image
        uses: actions/upload-artifact@v4
        with:
          # Nama artifact mencantumkan versi kernel untuk kejelasan
          name: ${{ env.KERNEL_NAME }}-5.10-Image
          path: out/arch/arm64/boot/Image
          compression-level: 9
          
      - name: Upload DTB
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.KERNEL_NAME }}-5.10-DTB
          path: out/arch/arm64/boot/dts/qcom/
          if-no-files-found: warn
          
      - name: Create AnyKernel3 Flashable Zip
        run: |
          echo "📦 Membuat flashable zip AnyKernel3..."
          # Clone AnyKernel3 template tanpa modifikasi manual
          git clone https://github.com/osm0sis/AnyKernel3.git -b master AnyKernel3
          
          # Copy kernel image
          cp out/arch/arm64/boot/Image AnyKernel3/
          
          # Copy semua DTB ke folder AnyKernel3
          mkdir -p AnyKernel3/dtbs
          find out/arch/arm64/boot/dts/qcom/ -name "*.dtb" -exec cp {} AnyKernel3/dtbs/ \;
          
          # Buat zip dengan nama kernel branding
          cd AnyKernel3
          zip -r9 ../${{ env.KERNEL_NAME }}-5.10.zip *
          cd ..
          echo "✅ Flashable zip berhasil dibuat: ${{ env.KERNEL_NAME }}-5.10.zip"
          
      - name: Upload AnyKernel3 Flashable Zip
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.KERNEL_NAME }}-5.10-Flashable
          path: ${{ env.KERNEL_NAME }}-5.10.zip
          compression-level: 0 # File sudah terkompresi
